# =============================================================================
# job-scout — arquivo de configuração
# =============================================================================

# Configuração do gateway OmniRoute (self-hosted, API compatível com
# OpenAI), usado para analisar o fit das vagas com o perfil (profile.md) e
# gerar os currículos personalizados.
# Ver docker-compose.yml — por padrão o job-scout roda no mesmo compose que
# o OmniRoute e acessa via nome do serviço ("omniroute").
omniroute_base_url: "http://omniroute:20128/v1"

# Chave de API gerada no próprio OmniRoute (dashboard do gateway), não a
# chave do provedor real (Anthropic/OpenAI/etc — essas ficam configuradas
# dentro do OmniRoute).
omniroute_api_key: ""

# Modelo a ser roteado pelo OmniRoute. Se você tiver mais de um provider
# configurado no gateway que ofereça o mesmo modelo, o nome "pelado" fica
# ambíguo e o OmniRoute rejeita a requisição (400 "Ambiguous model") — nesse
# caso use o prefixo provider/modelo que aparece no dashboard do OmniRoute
# em Providers/Models (ex: "kie/claude-haiku-4-5", "cnl/claude-haiku-4-5").
omniroute_model: "claude-haiku-4-5"

# Expressão cron (formato padrão de 5 campos: minuto hora dia mês dia-da-semana)
# que define a frequência de execução do crawler + análise.
# Exemplo abaixo: todos os dias às 8h e às 20h.
schedule: "0 8,20 * * *"

# Pontuação mínima de fit (0-100) para que uma vaga seja considerada relevante
# e exibida com destaque no dashboard.
min_fit_score: 60

# Porta em que o servidor HTTP do dashboard vai escutar.
server_port: 8080

# Notificação via Telegram quando uma vaga analisada atinge um fit_score
# mínimo. Deixe token/chat_id vazios para desabilitar.
# 1. Crie um bot com @BotFather e pegue o token.
# 2. Descubra seu chat_id (ex: enviando uma mensagem ao bot e consultando
#    https://api.telegram.org/bot<TOKEN>/getUpdates).
telegram_bot_token: ""
telegram_chat_id: ""

# Pontuação mínima de fit (0-100) para disparar a notificação no Telegram.
# Se omitido (ou 0), usa o mesmo valor de min_fit_score.
telegram_min_score: 0

# Lista de crawlers configurados. Cada crawler busca vagas em uma fonte
# específica (ex: site de empregos) usando os termos de busca informados.
crawlers:
  - name: gupy
    enabled: true
    search_terms: ["desenvolvedor backend", "golang", "engenheiro de software"]
    max_pages: 5 # 5 páginas x 10 vagas = até 50 vagas por search_term
  - name: indeed
    enabled: true
    search_terms: ["backend developer", "golang"]
    max_pages: 3
  - name: remoteok
    enabled: true
    search_terms: ["golang", "backend", "software engineer"]
    max_pages: 1 # ignorado — API retorna tudo de uma vez
  - name: programathor
    enabled: true
    search_terms: ["golang", "backend", "desenvolvedor"]
    max_pages: 3
  - name: trampos
    enabled: true
    search_terms: ["desenvolvedor", "backend", "engenheiro"]
    max_pages: 3
  - name: linkedin
    enabled: false
    search_terms: []
    max_pages: 0
  - name: weworkremotely
    enabled: true
    search_terms: ["golang", "backend", "go developer", "software engineer"]
    max_pages: 1 # ignorado — feeds RSS não têm paginação
  - name: lever
    enabled: true
    search_terms: ["golang", "backend", "go", "software engineer", "backend engineer"]
    max_pages: 1 # ignorado — busca em todas as empresas configuradas de uma vez
    # Lista de empresas com boards públicas no Lever (jobs.lever.co/{slug}).
    # Para adicionar uma empresa, verifique primeiro:
    #   curl "https://api.lever.co/v0/postings/{slug}?mode=json"
    # Resposta JSON (mesmo vazio) = válido. 404 = empresa não usa Lever.
    # Fonte inicial verificada em jul/2026 via jobspipe.dev/companies-using/lever
    companies:
      # Verificadas com vagas abertas em jul/2026
      - spotify
      - palantir
      - matchgroup
      - zoox
      - whoop
      - gopuff
      - ro
      - aircall
      - ledger
      - entrata
      # Verificadas com conta ativa (sem vagas abertas no momento da checagem)
      # Manter na lista pois podem abrir vagas — o crawler trata array vazio sem erro
      - kraken
      - mistral
  - name: hackernews
    enabled: true
    search_terms: ["golang", "go", "backend", "remote", "software engineer"]
    max_pages: 1 # ignorado — usa os primeiros 200 comentários do thread mensal
