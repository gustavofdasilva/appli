# =============================================================================
# job-scout — arquivo de configuração
# =============================================================================

# Configuração do gateway OmniRoute (self-hosted, API compatível com
# OpenAI), usado para analisar o fit das vagas com o perfil (profile.md) e
# gerar os currículos personalizados.
# Ver docker-compose.yml — por padrão o job-scout roda no mesmo compose que
# o OmniRoute e acessa via nome do serviço ("omniroute").
omniroute_base_url: "http://omniroute:20128/v1"

# Chave de API gerada no próprio OmniRoute (dashboard do gateway), não a
# chave do provedor real (Anthropic/OpenAI/etc — essas ficam configuradas
# dentro do OmniRoute).
omniroute_api_key: ""

# Modelo a ser roteado pelo OmniRoute (ex: um modelo Claude configurado como
# provider dentro do gateway).
omniroute_model: "claude-haiku-4-5"

# Expressão cron (formato padrão de 5 campos: minuto hora dia mês dia-da-semana)
# que define a frequência de execução do crawler + análise.
# Exemplo abaixo: todos os dias às 8h e às 20h.
schedule: "0 8,20 * * *"

# Pontuação mínima de fit (0-100) para que uma vaga seja considerada relevante
# e exibida com destaque no dashboard.
min_fit_score: 60

# Porta em que o servidor HTTP do dashboard vai escutar.
server_port: 8080

# Lista de crawlers configurados. Cada crawler busca vagas em uma fonte
# específica (ex: site de empregos) usando os termos de busca informados.
crawlers:
  - name: gupy
    enabled: true
    search_terms: ["desenvolvedor backend", "golang", "engenheiro de software"]
    max_pages: 5 # 5 páginas x 10 vagas = até 50 vagas por search_term
  - name: indeed
    enabled: true
    search_terms: ["backend developer", "golang"]
    max_pages: 3
  - name: remoteok
    enabled: true
    search_terms: ["golang", "backend", "software engineer"]
    max_pages: 1 # ignorado — API retorna tudo de uma vez
  - name: programathor
    enabled: true
    search_terms: ["golang", "backend", "desenvolvedor"]
    max_pages: 3
  - name: trampos
    enabled: true
    search_terms: ["desenvolvedor", "backend", "engenheiro"]
    max_pages: 3
  - name: linkedin
    enabled: false
    search_terms: []
    max_pages: 0
